name: v0 efficiency

on:
  workflow_dispatch:
  push:
    branches: [pipeline/v0-efficiency]
    paths:
      - .github/workflows/efficiency.yml
      - efficiency/*.py
      - efficiency/requirements*.txt

permissions:
  contents: read

jobs:
  public-readers:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install CPU readers
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install tesseract-ocr libgl1
          python -m pip install -q -r efficiency/requirements.txt -r efficiency/requirements-paddle.txt
      - name: Measure the pinned public images
        run: |
          python -B efficiency/run.py "$RUNNER_TEMP/v0" --download --runner-usd-hour 0.36 > "$RUNNER_TEMP/efficiency.json"
          cat "$RUNNER_TEMP/efficiency.json"
