name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package in a clean environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install .
          .venv/bin/python -m pip check
      - name: Run pytest
        run: |
          .venv/bin/python -m pip install pytest psutil==7.2.2
          .venv/bin/python -m pytest -q
  registered-efficiency:
    name: Registered efficiency dry-run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install pytest psutil==7.2.2
      - name: Execute isolated fixture runs on the pinned runner profile
        run: python tests/test_registered_efficiency.py "$RUNNER_TEMP/registered-efficiency-dev"
